name: yggdrasil-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: yggdrasil
      POSTGRES_PASSWORD: yggdrasil
      POSTGRES_DB: yggdrasil
    ports:
      - "${YG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yggdrasil"]
      interval: 5s
      timeout: 3s
      retries: 12

  rustfs:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: yggdrasil
      RUSTFS_SECRET_KEY: yggdrasil
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "${YG_RUSTFS_PORT:-9000}:9000"
      - "${YG_RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot: creates the Shard bucket so a clean stack is immediately usable.
  # Reuses the rustfs image because it ships curl; no extra image to pin.
  # Healthy precedes S3-ready, so 503s retry; 409 means the bucket exists.
  rustfs-init:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        for attempt in $$(seq 1 30); do
          code=$$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
            --aws-sigv4 aws:amz:us-east-1:s3 --user yggdrasil:yggdrasil \
            http://rustfs:9000/yggdrasil)
          case "$$code" in
            200|409) exit 0 ;;
          esac
          sleep 2
        done
        echo "creating the Shard bucket failed: HTTP $$code" >&2
        exit 1
    restart: "no"

  # Reference single-node deployment. Profile-gated so the existing backing-
  # service-only development flow is unchanged.
  server:
    profiles: [deployment]
    image: "${YG_IMAGE:-yggdrasil:local}"
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    environment:
      YG_LISTEN: 0.0.0.0:7311
      YG_DATABASE_URL: postgres://yggdrasil:yggdrasil@postgres:5432/yggdrasil
      YG_S3_ENDPOINT: http://rustfs:9000
      YG_S3_BUCKET: yggdrasil
      YG_S3_ACCESS_KEY: yggdrasil
      YG_S3_SECRET_KEY: yggdrasil
      YG_S3_REGION: us-east-1
      YG_BOOTSTRAP_TOKEN: "${YG_BOOTSTRAP_TOKEN:-}"
      YG_CURSOR_SECRET: "${YG_CURSOR_SECRET:-}"
      # Forge credential for private clones and org discovery; workers
      # read it directly, and compose does not forward host env unasked.
      YG_GITHUB_TOKEN: "${YG_GITHUB_TOKEN:-}"
    ports:
      - "127.0.0.1:${YG_SERVER_PORT:-7311}:7311"
    volumes:
      - server-git-cache:/var/lib/yggdrasil/git
      - server-shard-cache:/var/lib/yggdrasil/shard-cache
    depends_on:
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - YG_SERVER=http://127.0.0.1:7311 YG_TOKEN="$${YG_BOOTSTRAP_TOKEN}" /usr/local/bin/yg status --json >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped
    # Several seconds past the application's 30s drain deadline, so the
    # final lease-release cleanup is never raced by Docker's SIGKILL.
    stop_grace_period: 40s

volumes:
  postgres-data:
  rustfs-data:
  server-git-cache:
  server-shard-cache:
